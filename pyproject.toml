[project]
name = "local-log-analyzer"
version = "0.4.0"
description = "단일 장비 로그를 로컬에서 분석하는 데스크톱 앱 (LLA-DEV-PLAN-001 v0.2 R01)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # QtWidgets·QtCore·QtGui·QtTest만 들어 있는 작은 배포판 (REQUIREMENTS G-11)
    "PySide6-Essentials>=6.8,<6.13",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "openpyxl>=3.1.5",
    "pypdf>=7.1.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.uv]
# 설치용 패키지가 아니라 앱 소스이므로 빌드하지 않는다. 실행 파일은 Phase 9에서 PyInstaller로 만든다.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
addopts = "-ra"
markers = [
    "ollama_live: 실제 로컬 Ollama 서버가 필요한 시험 (LLA_LIVE_OLLAMA=1일 때만 실행)",
]
